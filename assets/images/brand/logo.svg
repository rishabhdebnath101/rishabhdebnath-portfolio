<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E6B8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Polygon / Shield -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#0D1420" stroke="#1E293B" stroke-width="2.5" />
  
  <!-- Subtle Internal Grid Accent -->
  <path d="M8 50 H92 M50 8 V92" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Monogram R & D Geometric Path -->
  <!-- 'R' Stem & Loop -->
  <path d="M 28 28 V 72 M 28 28 H 48 C 57 28 57 48 48 48 H 28 M 44 48 L 58 72" 
        stroke="url(#rdGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'D' Arc & AI Node Accent -->
  <path d="M 52 28 H 62 C 75 28 75 72 62 72 H 52" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.9" />

  <!-- Node Dot -->
  <circle cx="72" cy="50" r="4.5" fill="#00E6B8" filter="url(#subtleGlow)" />
</svg>
