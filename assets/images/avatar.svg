<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1420" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E6B8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00E6B8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Card Container -->
  <rect x="10" y="10" width="520" height="440" rx="20" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="10" y="10" width="520" height="44" rx="20" fill="#0D1420" />
  <path d="M10 54 H530" stroke="#1E293B" stroke-width="1" />
  <circle cx="36" cy="32" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="52" cy="32" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="68" cy="32" r="5" fill="#10B981" opacity="0.8" />
  <text x="96" y="36" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500">search-graph-engine // entity-matrix</text>
  <rect x="420" y="24" width="92" height="18" rx="9" fill="#070B12" stroke="#1E293B" />
  <circle cx="432" cy="33" r="3.5" fill="#00E6B8" />
  <text x="442" y="36" fill="#00E6B8" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600">LIVE CRAWL</text>

  <!-- Grid Blueprint Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3" opacity="0.35">
    <path d="M 40 100 H 500 M 40 170 H 500 M 40 240 H 500 M 40 310 H 500 M 40 380 H 500" />
    <path d="M 100 60 V 420 M 180 60 V 420 M 270 60 V 420 M 360 60 V 420 M 440 60 V 420" />
  </g>

  <!-- Connection Edges with Directed Pulses -->
  <g stroke="#334155" stroke-width="2">
    <!-- Center Node to Top Left (Query/Linguistics) -->
    <path d="M 270 210 L 140 120" stroke="url(#tealGrad)" stroke-width="2" />
    <!-- Center Node to Top Right (Schema/Entities) -->
    <path d="M 270 210 L 400 120" stroke="url(#cyanBlueGrad)" stroke-width="2" />
    <!-- Center Node to Bottom Left (Google SERP) -->
    <path d="M 270 210 L 130 330" stroke="#38B2F6" stroke-width="2" stroke-opacity="0.8" />
    <!-- Center Node to Bottom Right (AI Citation Nodes) -->
    <path d="M 270 210 L 410 330" stroke="#00E6B8" stroke-width="2" stroke-opacity="0.8" />
    <!-- Inter-node bridges -->
    <path d="M 140 120 L 400 120" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 130 330 L 410 330" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Top Left Node: Search Intent & Linguistics -->
  <g transform="translate(60, 85)">
    <rect width="160" height="66" rx="10" fill="#070B12" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="22" r="6" fill="#3B82F6" />
    <text x="34" y="26" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Search Intent</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Semantics &amp; Context</text>
    <text x="14" y="58" fill="#00E6B8" font-family="'IBM Plex Mono', monospace" font-size="9">Intent: Commercial / Nav</text>
  </g>

  <!-- Top Right Node: Entity Schema & Knowledge Graph -->
  <g transform="translate(320, 85)">
    <rect width="160" height="66" rx="10" fill="#070B12" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="22" r="6" fill="#00E6B8" />
    <text x="34" y="26" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Schema.org Graph</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">JSON-LD Entity Linking</text>
    <text x="14" y="58" fill="#3B82F6" font-family="'IBM Plex Mono', monospace" font-size="9">Wikidata / sameAs: [OK]</text>
  </g>

  <!-- Central Hub: Technical SEO & GEO Engine -->
  <g transform="translate(270, 210)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#00E6B8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="44" fill="#0D1420" stroke="url(#tealGrad)" stroke-width="2.5" filter="url(#softGlow)" />
    
    <!-- Central Icon/Symbol -->
    <circle cx="0" cy="0" r="28" fill="#070B12" stroke="#1E293B" stroke-width="1" />
    <path d="M -10 -8 L 10 -8 L 0 10 Z" fill="url(#tealGrad)" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />

    <!-- Badges around center -->
    <g transform="translate(-50, 52)">
      <rect width="100" height="22" rx="11" fill="#070B12" stroke="#00E6B8" stroke-width="1" />
      <text x="50" y="15" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">SEO + GEO CORE</text>
    </g>
  </g>

  <!-- Bottom Left Node: Google SERP & Technical Crawl -->
  <g transform="translate(50, 295)">
    <rect width="165" height="78" rx="10" fill="#070B12" stroke="#1E293B" stroke-width="1.5" />
    <div style="display:flex;"></div>
    <circle cx="20" cy="22" r="6" fill="#3B82F6" />
    <text x="34" y="26" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="12" font-weight="600">Google Search SERP</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Crawl Health: 100% Clean</text>
    <text x="14" y="58" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Core Web Vitals: &lt; 1.2s LCP</text>
    <text x="14" y="71" fill="#3B82F6" font-family="'IBM Plex Mono', monospace" font-size="9">Indexation: Fully Validated</text>
  </g>

  <!-- Bottom Right Node: Generative AI Citations -->
  <g transform="translate(325, 295)">
    <rect width="165" height="78" rx="10" fill="#070B12" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="22" r="6" fill="#00E6B8" />
    <text x="34" y="26" fill="#FFFFFF" font-family="'Sora', sans-serif" font-size="12" font-weight="600">AI Citations (GEO)</text>
    <text x="14" y="44" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Perplexity / ChatGPT Citations</text>
    <text x="14" y="58" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">AI Overviews Summaries</text>
    <text x="14" y="71" fill="#00E6B8" font-family="'IBM Plex Mono', monospace" font-size="9">Entity Citability: High</text>
  </g>

  <!-- Bottom Metrics Ticker Bar -->
  <g transform="translate(30, 395)">
    <rect width="480" height="34" rx="8" fill="#0B111A" stroke="#1E293B" />
    <text x="20" y="21" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Linguistics</text>
    <text x="88" y="21" fill="#00E6B8" font-family="'IBM Plex Mono', monospace" font-size="10">──→</text>
    <text x="120" y="21" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Technical Audits</text>
    <text x="228" y="21" fill="#00E6B8" font-family="'IBM Plex Mono', monospace" font-size="10">──→</text>
    <text x="260" y="21" fill="#94A3B8" font-family="'IBM Plex Mono', monospace" font-size="10">Knowledge Graph</text>
    <text x="375" y="21" fill="#00E6B8" font-family="'IBM Plex Mono', monospace" font-size="10">──→</text>
    <text x="405" y="21" fill="#3B82F6" font-family="'IBM Plex Mono', monospace" font-size="10">AI Citability</text>
  </g>
</svg>
